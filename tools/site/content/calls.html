  <div class="wrap">
    <h2>Calls, and the radio</h2>
    <p class="lede">A head unit is a radio and a telephone. Both get proper screens.</p>

    <figure class="film"><img loading="lazy" src="{{ROOT}}media/call-incoming.gif" alt="An incoming call: the caller's name filling the panel, a pulsing red border, ANSWER and REJECT in the corners">
      <figcaption>The ESP32 does hands-free calling alongside music — it is Bluetooth
        Classic, the same side of the chip question as A2DP, so adding calls does not
        change the hardware. One £4 I²S microphone and one spare pin. The border is the
        indicator: a phone ringing has to be caught in peripheral vision by somebody
        watching a road, and the biggest thing a panel has is its own edge.</figcaption></figure>

    <figure class="film"><img loading="lazy" src="{{ROOT}}media/call-active.gif" alt="In a call: duration on the left, caller name above, a live microphone level meter on the right">
      <figcaption>In a call: duration, who, and a <b>live microphone level</b>. That meter
        is the only feedback anywhere in the system that the mic is plugged in and being
        heard — without it, a working call and a dead microphone look identical.</figcaption></figure>

    <figure class="film"><img loading="lazy" src="{{ROOT}}media/radio-fm.gif" alt="FM radio: station name from RDS, frequency below, a band scale with preset marks, signal bars and a stereo indicator">
      <figcaption>And a tuner worth having. RDS station name first, frequency under it, and
        a band scale with your presets marked — because a radio without one feels broken
        when you seek: the number jumps and nothing says whether you moved a little or
        crossed the band. Signal is a <em>count</em> of segments and stereo is a glyph that
        is there or is not, never a brightness, which vanishes on a 1-bit panel.</figcaption></figure>

    <p class="muted small">Both screens are written and rendered from the real
      <code>core/</code>. <b>Neither driver is.</b>
      <a href="{{BLOB}}/docs/CALLING.md">CALLING.md</a>
      and
      <a href="{{BLOB}}/docs/RADIO.md">RADIO.md</a>
      say exactly what exists, what is designed, and what each costs to build.</p>
  </div>

</section>
