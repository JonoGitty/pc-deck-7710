<section>
  <div class="wrap">
    <h2>The screens</h2>
    <p class="lede">Ten display modes, every dot drawn by <code>core/</code>.</p>
    <div class="grid">
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/spectrum.gif" alt="Thirteen segmented bars rising and falling with peak-hold dots above them">
        <h3>Spectrum analyser</h3><p>13 bands, 63 Hz–16 kHz, peak-hold dots that fall back slowly.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/mirror.gif" alt="Bars growing left and right from the centre of the panel">
        <h3>Mirror spectrum</h3><p>Left and right channels split, growing outward from centre.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/vu.gif" alt="Two analogue-style needles swinging across arc scales">
        <h3>VU meter</h3><p>Twin needles with overshoot and recoil. Without the overshoot it is a bar chart with a line on it.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/scope.gif" alt="A waveform trace with fading persistence trails behind it">
        <h3>Oscilloscope</h3><p>Dot-matrix scope with phosphor persistence trailing the live trace.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/city.gif" alt="Wide tower blocks of varying height with a scan line rising through them">
        <h3>Cityscape EQ</h3><p>Coarse tower blocks, bass gets the broad ones, with a rising scan sweep.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/waterfall.gif" alt="A scrolling grid of blocks showing spectral history climbing upward">
        <h3>Waterfall</h3><p>A 32×12 spectral memory climbing up the panel.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/3d.gif" alt="A perspective landscape of analyser rows receding into the distance">
        <h3>3D spectrum</h3><p>A receding analyser landscape with hidden-line removal.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/ocean.gif" alt="Dolphins swimming below a dotted waterline with bubbles rising">
        <h3>Ocean cruise</h3><p>The dolphins. Procedural, so bass makes the pod breach and treble drives the bubbles.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/cover.gif" alt="Album sleeve dithered to four levels beside track text and a progress time">
        <h3>Album art</h3><p>The sleeve, ordered-dithered to four levels, with a slim analyser along the bottom.</p></figure>
      <figure class="card" style="margin:0"><img loading="lazy" src="{{ROOT}}media/lyrics.gif" alt="Lyric lines with the current line brighter than its neighbours">
        <h3>Lyrics</h3><p>Synced from LRCLIB. Current line hot, neighbours dim, long lines wrapped.</p></figure>
    </div>

    <h3 style="margin:2.5rem 0 1rem">On the whole faceplate</h3>
    <figure class="film"><img loading="lazy" src="{{ROOT}}media/faceplate-cover.png" alt="The full deck showing the album art screen"></figure>
    <figure class="film"><img loading="lazy" src="{{ROOT}}media/faceplate-lyrics.png" alt="The full deck showing the lyrics screen"></figure>
    <figure class="film"><img loading="lazy" src="{{ROOT}}media/faceplate-vu.png" alt="The full deck showing the VU meter"></figure>
    <figure class="film"><img loading="lazy" src="{{ROOT}}media/faceplate-waterfall.png" alt="The full deck showing the waterfall display"></figure>
    <figure class="film" style="margin-bottom:0"><img loading="lazy" src="{{ROOT}}media/faceplate-ocean.png" alt="The full deck showing dolphins under a waterline">
      <figcaption>Idle behaviour, faithful to the era: music stops, three seconds
        to the clock, twelve to the dolphins, and a hard horizontal wipe back to
        the analyser when it returns.</figcaption></figure>
  </div>

</section>
