# Publish docs/ as the project site.
#
# WHY THIS EXISTS RATHER THAN "DEPLOY FROM A BRANCH"
#
# Pages can serve a folder straight out of a branch with no workflow at all,
# and that is one fewer moving part. It is also completely opaque: when the
# site 404s there is nothing to read. You cannot tell whether Pages is off,
# whether it is pointed at a branch that does not exist, or whether a build
# failed — the symptom is identical in all three cases, which is exactly the
# situation this repository was in.
#
# A workflow gives you a run to look at. It either went green and the site is
# live, or it went red and says why.
#
# ⚠️ THIS DOES NOTHING UNTIL SOMEBODY CHANGES ONE SETTING.
#
#     Settings → Pages → Build and deployment → Source: GitHub Actions
#
# That is a repository setting; no workflow, token or API call in this repo can
# set it. If Pages is currently set to "Deploy from a branch", this file sits
# here doing nothing until it is switched.
name: pages

on:
  push:
    branches: [master]        # the default branch is master, not main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:          # so it can be run by hand the first time

# Deploy needs to write a Pages deployment and mint an OIDC token to prove it
# is this repository. Everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer one win — but never cancel a deploy
# that is already in flight, which would leave the live site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fails loudly here rather than publishing an empty site that 404s in a
      # way indistinguishable from Pages being switched off.
      - name: the site is actually there
        run: |
          test -f docs/index.html || { echo "docs/index.html is missing"; exit 1; }
          test -f docs/.nojekyll || { echo "docs/.nojekyll is missing — Jekyll will eat the site"; exit 1; }
          echo "docs/ has $(find docs/media -type f | wc -l) media files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
